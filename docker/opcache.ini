; OPcache — keeps compiled PHP in memory so each request doesn't re-parse
; config.php, includes and vendor (PhpSpreadsheet) files. The container's code
; never changes after deploy, but timestamps are still checked (every 60 s) so
; nothing behaves differently if files are ever updated in place.
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=60
