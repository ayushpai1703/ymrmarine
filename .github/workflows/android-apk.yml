# Builds the YSMS Android test app (mobile/) and attaches the APK to the run.
# Download: GitHub → Actions → "Android test APK" → latest run → Artifacts.
# It only builds a file; nothing is deployed and no server or database is touched.
name: Android test APK

on:
  push:
    branches: [staging]
    paths:
      - 'mobile/**'
      - '!mobile/ysms_app/**'   # the Flutter app has its own workflow (flutter-app.yml)
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Page the app opens (empty = staging, from mobile/capacitor.config.json)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v4

      # The login screen is a Flutter module (mobile/flutter_login), built into the app by Gradle.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Flutter login screen (get packages, tests)
        working-directory: mobile/flutter_login
        run: |
          flutter pub get
          flutter test

      - name: Install Capacitor
        working-directory: mobile
        run: npm ci

      - name: Copy web files and plugins into the Android project
        working-directory: mobile
        env:
          YSMS_SERVER_URL: ${{ inputs.server_url }}
        run: npm run sync

      # Push notifications need the Firebase project's google-services.json, kept as the repository
      # secret GOOGLE_SERVICES_JSON. Without it the APK still builds; the app then skips push set-up.
      - name: Firebase config (push notifications)
        working-directory: mobile/android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "Firebase config added"
          else
            echo "No GOOGLE_SERVICES_JSON secret: building without push notifications"
          fi

      - name: Android NDK (strips the Flutter engine's debug symbols)
        run: yes | sdkmanager --install "ndk;27.0.12077973" > /dev/null

      - name: Build test APK
        working-directory: mobile/android
        env:
          YSMS_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "../YMR-YSMS-test-${{ github.run_number }}.apk"
          ls -la ../YMR-YSMS-test-*.apk
          unzip -l ../YMR-YSMS-test-*.apk | sort -k1 -n | tail -12

      - uses: actions/upload-artifact@v7
        with:
          name: YMR-YSMS-test-apk-${{ github.run_number }}
          path: mobile/YMR-YSMS-test-*.apk
          retention-days: 30
          if-no-files-found: error
